name: Deploy to Hostinger
on:
  push:
    branches: [main]
  schedule:
    # Refresh week-forecast.json + season-heights.json a few times a day.
    - cron: '15 6,12,18 * * *'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      # Sync only — never wipe the remote first. dangerous-clean-slate left the
      # subdomain empty (Hostinger 403) when a scheduled build/FTP step failed.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          dangerous-clean-slate: false
